<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">CO2 Hydrogenation to Green Methanol Flowsheet</title>
<desc id="d">Process flowsheet of the C++ digital twin showing feed compression, reaction, recycle loop, and product purification.</desc>

<defs>
  <marker id="arrow-fwd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M1 1L8 5L1 9" fill="none" stroke="#334155" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arrow-rec" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M1 1L8 5L1 9" fill="none" stroke="#1D4ED8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arrow-pur" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M1 1L8 5L1 9" fill="none" stroke="#0F766E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arrow-prod" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M1 1L8 5L1 9" fill="none" stroke="#059669" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Background -->
<rect x="0" y="0" width="1120" height="640" fill="#FFFFFF"/>

<!-- Flowsheet Title Banner -->
<text x="40" y="28" font-size="15" font-weight="600" fill="#0F172A">Green Methanol Synthesis Plant Flowsheet (First-Principles Digital Twin)</text>

<!-- ================= LAYER 1: FEEDS & COMPRESSION ================= -->
<!-- Electrolyser -->
<rect x="40" y="48" width="140" height="54" fill="#ECFDF5" stroke="#059669" stroke-width="1.2"/>
<text x="110" y="71" text-anchor="middle" font-size="13" font-weight="600" fill="#064E3B">Electrolyser</text>
<text x="110" y="90" text-anchor="middle" font-size="11" fill="#047857">PEM, H2 at 30 bar</text>

<!-- Fresh CO2 -->
<rect x="40" y="132" width="140" height="54" fill="#F1F5F9" stroke="#64748B" stroke-width="1.2"/>
<text x="110" y="155" text-anchor="middle" font-size="13" font-weight="600" fill="#1E293B">Fresh CO2</text>
<text x="110" y="174" text-anchor="middle" font-size="11" fill="#475569">88 t/h at 1 bar</text>

<!-- H2 Compressor -->
<rect x="230" y="48" width="145" height="54" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.2"/>
<text x="302" y="71" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A8A">H2 Compressor</text>
<text x="302" y="90" text-anchor="middle" font-size="11" fill="#2563EB">1 stage, to 78 bar</text>

<!-- CO2 Compressor -->
<rect x="230" y="132" width="145" height="54" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.2"/>
<text x="302" y="155" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A8A">CO2 Compressor</text>
<text x="302" y="174" text-anchor="middle" font-size="11" fill="#2563EB">4 stages, to 78 bar</text>

<!-- ================= LAYER 2: MIXING, REACTION & HEAT INTEGRATION ================= -->
<!-- Mixer and FEHE -->
<rect x="445" y="85" width="160" height="60" fill="#FFFBEB" stroke="#D97706" stroke-width="1.2"/>
<text x="525" y="110" text-anchor="middle" font-size="13" font-weight="600" fill="#78350F">Mixer &amp; FEHE</text>
<text x="525" y="129" text-anchor="middle" font-size="11" fill="#B45309">Preheat to 210 °C</text>

<!-- Synthesis Reactor -->
<rect x="675" y="85" width="175" height="60" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.2"/>
<text x="762" y="110" text-anchor="middle" font-size="13" font-weight="600" fill="#7F1D1D">Synthesis Reactor</text>
<text x="762" y="129" text-anchor="middle" font-size="11" fill="#B91C1C">6204 tubes, BWR 245 °C</text>

<!-- Trim Cooler -->
<rect x="675" y="185" width="175" height="54" fill="#F0F9FF" stroke="#0284C7" stroke-width="1.2"/>
<text x="762" y="208" text-anchor="middle" font-size="13" font-weight="600" fill="#0C4A6E">Trim Cooler</text>
<text x="762" y="227" text-anchor="middle" font-size="11" fill="#0284C7">Cool to 35 °C</text>

<!-- ================= LAYER 3: FLASH & GAS RECYCLE LOOP ================= -->
<!-- Knockout Drum -->
<rect x="675" y="285" width="175" height="54" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.2"/>
<text x="762" y="308" text-anchor="middle" font-size="13" font-weight="600" fill="#4C1D95">Knockout Drum</text>
<text x="762" y="327" text-anchor="middle" font-size="11" fill="#6D28D9">Flash at 71.6 bar</text>

<!-- Recycle Split -->
<rect x="445" y="285" width="160" height="54" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.2"/>
<text x="525" y="308" text-anchor="middle" font-size="13" font-weight="600" fill="#4C1D95">Recycle Split</text>
<text x="525" y="327" text-anchor="middle" font-size="11" fill="#6D28D9">99% Recycle / 1% Purge</text>

<!-- Circulator -->
<rect x="230" y="285" width="145" height="54" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.2"/>
<text x="302" y="308" text-anchor="middle" font-size="13" font-weight="600" fill="#4C1D95">Circulator</text>
<text x="302" y="327" text-anchor="middle" font-size="11" fill="#6D28D9">Recompress to 78 bar</text>

<!-- Purge Membrane -->
<rect x="445" y="390" width="160" height="54" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.2"/>
<text x="525" y="413" text-anchor="middle" font-size="13" font-weight="600" fill="#4C1D95">Purge Membrane</text>
<text x="525" y="432" text-anchor="middle" font-size="11" fill="#6D28D9">Recover 90% H2</text>

<!-- Permeate Booster -->
<rect x="230" y="390" width="145" height="54" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.2"/>
<text x="302" y="413" text-anchor="middle" font-size="13" font-weight="600" fill="#4C1D95">Permeate Booster</text>
<text x="302" y="432" text-anchor="middle" font-size="11" fill="#6D28D9">Boost to 78 bar</text>

<!-- Tail Gas -->
<rect x="675" y="390" width="175" height="54" fill="#F1F5F9" stroke="#64748B" stroke-width="1.2"/>
<text x="762" y="413" text-anchor="middle" font-size="13" font-weight="600" fill="#1E293B">Tail Gas</text>
<text x="762" y="432" text-anchor="middle" font-size="11" fill="#475569">Retentate to fuel</text>

<!-- ================= LAYER 4: PURIFICATION & PRODUCTS ================= -->
<!-- Let-down Flash -->
<rect x="915" y="285" width="165" height="54" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.2"/>
<text x="997" y="308" text-anchor="middle" font-size="13" font-weight="600" fill="#134E4A">Let-down Flash</text>
<text x="997" y="327" text-anchor="middle" font-size="11" fill="#0F766E">Degas at 25 bar</text>

<!-- Degas Vent -->
<rect x="915" y="185" width="165" height="46" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3 2"/>
<text x="997" y="206" text-anchor="middle" font-size="12" font-weight="500" fill="#334155">Off-Gas Vent</text>
<text x="997" y="221" text-anchor="middle" font-size="10" fill="#64748B">Dissolved H2/CO2 to fuel</text>

<!-- Distillation Column -->
<rect x="915" y="390" width="165" height="54" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.2"/>
<text x="997" y="413" text-anchor="middle" font-size="13" font-weight="600" fill="#134E4A">Distillation Column</text>
<text x="997" y="432" text-anchor="middle" font-size="11" fill="#0F766E">99.5% recovery</text>

<!-- Wastewater Bottoms -->
<rect x="790" y="495" width="145" height="54" fill="#F1F5F9" stroke="#64748B" stroke-width="1.2"/>
<text x="862" y="518" text-anchor="middle" font-size="13" font-weight="600" fill="#1E293B">Wastewater</text>
<text x="862" y="537" text-anchor="middle" font-size="11" fill="#475569">Column bottoms</text>

<!-- Methanol Product -->
<rect x="955" y="495" width="150" height="54" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
<text x="1030" y="518" text-anchor="middle" font-size="13" font-weight="700" fill="#064E3B">Methanol Product</text>
<text x="1030" y="537" text-anchor="middle" font-size="11" font-weight="500" fill="#047857">99.9 wt%, 17.2 kg/s</text>

<!-- ================= STREAM CONNECTORS & ARROWS ================= -->
<!-- Fresh feeds to compressors -->
<line x1="180" y1="75" x2="225" y2="75" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow-fwd)"/>
<line x1="180" y1="159" x2="225" y2="159" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow-fwd)"/>

<!-- Compressors into Mixer (Enter left face cleanly) -->
<path d="M375 75 L410 75 L410 102 L440 102" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow-fwd)"/>
<path d="M375 159 L410 159 L410 128 L440 128" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow-fwd)"/>

<!-- Mixer to Reactor -->
<line x1="605" y1="115" x2="670" y2="115" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow-fwd)"/>

<!-- Reactor to Trim Cooler -->
<line x1="762" y1="145" x2="762" y2="180" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow-fwd)"/>
<text x="775" y="167" font-size="10.5" fill="#64748B">Hot Effluent</text>

<!-- Trim Cooler to Knockout Drum -->
<line x1="762" y1="239" x2="762" y2="280" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow-fwd)"/>
<text x="775" y="264" font-size="10.5" fill="#64748B">Two-phase, 35 °C</text>

<!-- Knockout Drum Vapor to Recycle Split -->
<line x1="675" y1="312" x2="610" y2="312" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow-fwd)"/>
<text x="642" y="304" text-anchor="middle" font-size="10.5" font-weight="500" fill="#6D28D9">Vapor</text>

<!-- Recycle Split to Circulator -->
<line x1="445" y1="312" x2="380" y2="312" stroke="#1D4ED8" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow-rec)"/>
<text x="410" y="304" text-anchor="middle" font-size="10.5" font-weight="500" fill="#1D4ED8">Recycle</text>

<!-- Recycle Split to Purge Membrane -->
<line x1="525" y1="339" x2="525" y2="385" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow-fwd)"/>
<text x="537" y="367" font-size="10.5" fill="#6D28D9">Purge</text>

<!-- Purge Membrane to Permeate Booster -->
<line x1="445" y1="417" x2="380" y2="417" stroke="#1D4ED8" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow-rec)"/>
<text x="410" y="409" text-anchor="middle" font-size="10.5" font-weight="500" fill="#1D4ED8">H2 Permeate</text>

<!-- Purge Membrane to Tail Gas -->
<line x1="605" y1="417" x2="670" y2="417" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow-fwd)"/>
<text x="640" y="409" text-anchor="middle" font-size="10.5" fill="#64748B">Retentate</text>

<!-- Circulator Return to Mixer (Enters bottom face at x=485 with generous spacing) -->
<path d="M302 285 L302 215 L485 215 L485 150" fill="none" stroke="#1D4ED8" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow-rec)"/>
<text x="390" y="208" text-anchor="middle" font-size="10.5" font-weight="500" fill="#1D4ED8">Recycle Return (78 bar)</text>

<!-- Permeate Booster Return to Mixer (Enters bottom face at x=565 via dedicated open channel) -->
<path d="M230 417 L205 417 L205 245 L565 245 L565 150" fill="none" stroke="#1D4ED8" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow-rec)"/>
<text x="390" y="239" text-anchor="middle" font-size="10.5" font-weight="500" fill="#1D4ED8">Permeate Return (78 bar)</text>

<!-- Knockout Drum Liquid to Let-down Flash -->
<line x1="850" y1="312" x2="910" y2="312" stroke="#0F766E" stroke-width="1.6" marker-end="url(#arrow-pur)"/>
<text x="882" y="304" text-anchor="middle" font-size="10.5" font-weight="500" fill="#0F766E">Crude Liquid</text>

<!-- Let-down Flash Vent -->
<line x1="997" y1="285" x2="997" y2="236" stroke="#64748B" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrow-fwd)"/>

<!-- Let-down Flash to Distillation -->
<line x1="997" y1="339" x2="997" y2="385" stroke="#0F766E" stroke-width="1.6" marker-end="url(#arrow-pur)"/>
<text x="1009" y="367" font-size="10.5" fill="#0F766E">Degassed</text>

<!-- Distillation to Wastewater (Bottoms) -->
<path d="M940 444 L940 470 L862 470 L862 490" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#arrow-fwd)"/>
<text x="895" y="465" text-anchor="middle" font-size="10.5" fill="#64748B">Bottoms</text>

<!-- Distillation to Methanol Product (Overhead) -->
<line x1="1030" y1="444" x2="1030" y2="490" stroke="#059669" stroke-width="2" marker-end="url(#arrow-prod)"/>
<text x="1042" y="471" text-anchor="start" font-size="10.5" font-weight="600" fill="#047857">Distillate</text>

<!-- ================= LEGEND BAR AT BOTTOM ================= -->
<line x1="40" y1="565" x2="1080" y2="565" stroke="#E2E8F0" stroke-width="1"/>

<!-- Flow lines legend -->
<line x1="65" y1="597" x2="95" y2="597" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow-fwd)"/>
<text x="103" y="601" font-size="11.5" fill="#334155">Forward process stream</text>

<line x1="270" y1="597" x2="300" y2="597" stroke="#1D4ED8" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-rec)"/>
<text x="308" y="601" font-size="11.5" fill="#1D4ED8">Recycle / permeate return</text>

<!-- Layer color indicators -->
<circle cx="560" cy="597" r="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="570" y="601" font-size="11.5" fill="#1E3A8A">Feed compression</text>

<circle cx="705" cy="597" r="5" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
<text x="715" y="601" font-size="11.5" fill="#7F1D1D">Reaction &amp; heat</text>

<circle cx="835" cy="597" r="5" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
<text x="845" y="601" font-size="11.5" fill="#4C1D95">Recycle loop</text>

<circle cx="945" cy="597" r="5" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
<text x="955" y="601" font-size="11.5" fill="#064E3B">Purification &amp; product</text>

</svg>
