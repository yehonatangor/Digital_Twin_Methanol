[project]
name = "methanol-twin-ml"
version = "0.1.0"
description = "Machine-learning experiments using the methanol digital twin"
requires-python = ">=3.11"
dependencies = [
    "digital-twin==0.1.0",
    "numpy>=2.0",
    "pandas>=2.0",
    "scikit-learn>=1.4",
    "scipy >= 1.14",
    "torch >= 2.5",
    "matplotlib >=3.9",
]

[tool.uv]
package = false

[tool.uv.sources]
digital-twin = { path = "../python/digital_twin", editable = true }

[dependency-groups]
dev = ["pybind11>=2.13"]
